<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>דרגו אותנו בגוגל</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;

            padding-top: 12vh;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 30px;
        }

        .google-logo {
            display: block;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
        }

        .title {
            text-align: center;
            color: #202124;

            font-size: 32px;
            font-weight: 700;

            margin-top: 5px;
            margin-bottom: 8px;

            direction: rtl;
        }

        .subtitle {
            text-align: center;
            color: #70757a;

            font-size: 17px;

            margin-bottom: 30px;

            direction: rtl;
        }

        .stars-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);

            width: 100%;
            gap: 2px;

            direction: ltr;
        }

        .rating-item {
            min-width: 0;
            text-align: center;
        }

        .star {
            appearance: none;
            -webkit-appearance: none;

            width: 100%;
            height: 95px;
            min-height: 95px;

            padding: 0;
            margin: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #fbbc04;

            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(54px, 13vw, 75px);
            line-height: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .star:hover {
            transform: scale(1.08);
        }

        .star:active {
            transform: scale(0.98);
        }

        .rating-number {
            text-align: center;

            color: #4a4a4a;

            font-size: 28px;
            font-weight: 700;

            line-height: 1;

            margin-top: 8px;
        }

        .thank-you {
            display: none;

            text-align: center;
            direction: rtl;

            color: #202124;

            font-size: 24px;
            font-weight: 700;

            margin-top: 35px;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 15vh;
                padding-left: 18px;
                padding-right: 18px;
            }

            .title {
                font-size: 27px;
            }

            .subtitle {
                font-size: 16px;
                margin-bottom: 25px;
            }

            .star {
                font-size: clamp(54px, 18vw, 70px);
            }
        }

        @media (max-width: 360px) {
            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <img
        class="google-logo"
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
    >

    <div class="title">
        דרגו אותנו בגוגל
    </div>

    <div class="subtitle">
        לחצו על כוכב כדי לדרג אותנו
    </div>


    <div id="ratingArea">

        <div class="stars-row">

            <div class="rating-item">
                <button class="star" onclick="selectRating(5)">★</button>
                <div class="rating-number">5</div>
            </div>

            <div class="rating-item">
                <button class="star" onclick="selectRating(4)">★</button>
            </div>

            <div class="rating-item">
                <button class="star" onclick="selectRating(3)">★</button>
            </div>

            <div class="rating-item">
                <button class="star" onclick="selectRating(2)">★</button>
            </div>

            <div class="rating-item">
                <button class="star" onclick="selectRating(1)">★</button>
                <div class="rating-number">1</div>
            </div>

        </div>

    </div>


    <div id="thankYou" class="thank-you">
        🙏 תודה על הדירוג!
    </div>

</div>

    document.getElementById("thankYou").style.display = "block";
}

</script>

</body>
</html>
