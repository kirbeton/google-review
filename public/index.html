<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>דרגו אותנו בגוגל</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 100px 18px 30px;
            text-align: center;
        }

        .google-logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .g1 { color: #4285F4; }
        .g2 { color: #EA4335; }
        .g3 { color: #FBBC05; }
        .g4 { color: #4285F4; }
        .g5 { color: #34A853; }
        .g6 { color: #EA4335; }

        h1 {
            margin: 0 0 8px;
            color: #202124;
            font-size: 28px;
        }

        .subtitle {
            color: #70757a;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .stars {
            direction: ltr;
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .rating {
            width: 20%;
            text-align: center;
        }

        .star {
            display: block;
            width: 100%;
            height: 85px;

            margin: 0;
            padding: 0;

            border: 0;
            background: transparent;

            color: #fbbc04;

            font-size: 65px;
            line-height: 85px;

            cursor: pointer;

            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .number {
            color: #4a4a4a;
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
        }

        #thanks {
            display: none;
            margin-top: 35px;

            color: #202124;

            font-size: 24px;
            font-weight: bold;
        }

        @media (max-width: 380px) {
            .star {
                font-size: 55px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="google-logo" aria-label="Google">
        <span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g4">g</span><span class="g5">l</span><span class="g6">e</span>
    </div>

    <h1>דרגו אותנו בגוגל</h1>

    <div class="subtitle">
        לחצו על כוכב כדי לדרג אותנו
    </div>

    <div id="rating-area">

        <div class="stars">

            <div class="rating">
                <button type="button" class="star" onclick="rate(5)">★</button>
                <div class="number">5</div>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(4)">★</button>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(3)">★</button>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(2)">★</button>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(1)">★</button>
                <div class="number">1</div>
            </div>

        </div>

    </div>

    <div id="thanks">
        🙏 תודה על הדירוג!
    </div>

</div>

<script>
    const GOOGLE_REVIEW_URL =
        "https://www.google.com/search?q=%D7%A4%D7%99%D7%A6%D7%94+%D7%A9%D7%99%D7%A8%D7%95%D7%A7%D7%95";

    function rate(rating) {

        if (rating >= 4) {
            window.location.assign(GOOGLE_REVIEW_URL);
            return;
        }

        document.getElementById("rating-area").style.display = "none";
        document.getElementById("thanks").style.display = "block";
    }
</script>

</body>
</html>
