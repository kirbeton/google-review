<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>דרגו אותנו בגוגל</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 100px 18px 30px;
            text-align: center;
        }

        .google-logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .g1 { color: #4285F4; }
        .g2 { color: #EA4335; }
        .g3 { color: #FBBC05; }
        .g4 { color: #4285F4; }
        .g5 { color: #34A853; }
        .g6 { color: #EA4335; }

        h1 {
            margin: 0 0 8px;
            color: #202124;
            font-size: 28px;
        }

        .subtitle {
            color: #70757a;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .stars {
            direction: ltr;
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .rating {
            width: 20%;
            text-align: center;
        }

        .star {
            display: block;
            width: 100%;
            height: 85px;

            margin: 0;
            padding: 0;

            border: 0;
            background: transparent;

            color: #fbbc04;

            font-size: 65px;
            line-height: 85px;

            cursor: pointer;

            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .number {
            color: #4a4a4a;
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
        }

        #feedback-area {
            display: none;
            margin-top: 25px;
        }

        .feedback-title {
            font-size: 20px;
            font-weight: bold;
            color: #202124;
            margin-bottom: 15px;
        }

        #feedback {
            width: 100%;
            min-height: 120px;
            padding: 15px;

            border: 1px solid #dadce0;
            border-radius: 10px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;

            resize: vertical;
        }

        .send-button {
            margin-top: 15px;
            padding: 12px 35px;

            border: 0;
            border-radius: 8px;

            background: #4285F4;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        #thanks {
            display: none;
            margin-top: 35px;

            color: #202124;

            font-size: 24px;
            font-weight: bold;
        }

        @media (max-width: 380px) {
            .star {
                font-size: 55px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="google-logo" aria-label="Google">
        <span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g4">g</span><span class="g5">l</span><span class="g6">e</span>
    </div>

    <h1>דרגו אותנו בגוגל</h1>

    <div class="subtitle">
        לחצו על כוכב כדי לדרג אותנו
    </div>

    <div id="rating-area">

        <div class="stars">

            <div class="rating">
                <button type="button" class="star" onclick="rate(5)">★</button>
                <div class="number">5</div>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(4)">★</button>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(3)">★</button>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(2)">★</button>
            </div>

            <div class="rating">
                <button type="button" class="star" onclick="rate(1)">★</button>
                <div class="number">1</div>
            </div>

        </div>

    </div>


    <!-- אזור הערה לדירוג 1-3 -->
    <div id="feedback-area">

        <div class="feedback-title">
            נשמח לדעת איך נוכל להשתפר
        </div>

        <textarea
            id="feedback"
            placeholder="כתבו לנו הערה..."
        ></textarea>

        <br>

        <button
            type="button"
            class="send-button"
            onclick="submitFeedback()"
        >
            שלח
        </button>

    </div>


    <!-- הודעת תודה -->
    <div id="thanks">
        🙏 תודה על הדירוג!
    </div>

</div>


<script>
    const BUSINESSES = {

        shiroko: {
            googleUrl: "https://www.google.com/search?q=%D7%A4%D7%99%D7%A6%D7%94+%D7%A9%D7%99%D7%A8%D7%95%D7%A7%D7%95&oq=&gs_lcrp=EgZjaHJvbWUqCQgBECMYJxjqAjIJCAAQIxgnGOoCMgkIARAjGCcY6gIyCQgCECMYJxjqAjIJCAMQIxgnGOoCMgkIBBAjGCcY6gIyCQgFECMYJxjqAjIJCAYQIxgnGOoCMgkIBxAjGCcY6gLSAQkxODI5ajBqMTWoAgiwAgHxBaxu4L0x9u4D&sourceid=chrome&source=chrome.rb&ie=UTF-8#sv=CAESzQEKuQEStgEKd0FKaVQ0dEwtckx4OEJ6dTh4enFrR3FUYTlfbGo3RlJPcnZxUVM5SFQ4aFBaRXhPbG5iclAzUWFHUWNWZWNERzZkN253SnZKZUFhRXFtMTNSLUNhWVkzX29mVzZjTTRDT2U2TmQ3SzVGWVRVc2hHRkZCVEpjRExFEhctTHk3YXR5M01aR2toYklQZ01lR21BcxoiQURzcjlmUXVCNllLNU5wbnFwWEdlQ0ZIeGFaOGNUZWxwURIEODA1MRoBMyoAMAA4AUAAGAAgjKLv7wtKAhAB"
        },

        restaurant2: {
            googleUrl: "https://www.google.com/search?client=safari&hs=4qiq&sca_esv=3b528c4e8e292c43&hl=he-il&sxsrf=APpeQntOUayOLqyRkuZ6JCUu6mv1N1pneg:1790694118227&q=%D7%91%D7%99%D7%A7%D7%95%D7%A8%D7%95%D7%AA+%D7%A2%D7%9C+%D7%90%D7%95%D7%9E%D7%A0%D7%95%D7%AA+%D7%94%D7%A9%D7%99%D7%A2%D7%A8&uds=AJ5uw18bfgRWiwhsC5Fh0AYRcvLuCN2S3OGf8dcO27M43OvARdWrVCEtryLc9GmZylrzgPEye9RKfZj8dGUD0mlffAbl7U4-x-hFNrIXg8C8AvOyiKm28j4EnpDPd1KFaz3IDY9HThzX0CEQcunRpmB6Aq4p3qgpH9h_7070fkjh8LxRNTODCsFFNeX1DuZYlk305E04TAKfnr-vrY7RXMDDi5I8IOL4ujZRLQCPA7dXAxuwEvIJpiLUTTOWTcHjRwaqTPulhmvFvz5rNR3Z-q-nNDkuwIVnt4nc_nPGaksxkXuSUXTl8j8TFJn-77y_2Y8i2fZFjKxosd5RDyfZ3t1_LVz2Cj5DxV2QEMZv9wUR9pLAFyvOBgxLAlpo1tXednmZ9tf3dH_lghiI8Y3tgcx5n-VDFvm7IhX-cCxfXgADa3v2z6x18ccVHcEQOzDM7pfDboJEAmeFXDsNpukup4AKnjHQU81BCfnHCijU2us4GL3gjZ1KBs2sncTWJWBdD-SYnA3tjQ1qh5W4am-ynDb6s4RhAwQzrg&si=APenkKm7iecQ4G6P-TsbSMFKIQtv3EFIqRAFw-i8uEbk55Z-_zlN7Ju5EFGBKAjBXJ1u8nLWO3HAL1Aw50rYiQOjQKE4BT7eXfdH97VRvv-zICZYGP2H4e8wVih8sKIHjCJirSXQPrcBLqEO8eEP8ZZBZip8kppOT1TR1vobJe2396sINGdia8o%3D&sa=X&ved=2ahUKEwiSicW2h5SXAxXNQvEDHY87AokQk8gLegQIGxAB&ictx=1#ebo=1"
        }
    };


    const params = new URLSearchParams(window.location.search);

    const businessId = params.get("business");

    const business = BUSINESSES[businessId];


    function rate(rating) {

        if (!business) {
            alert("העסק לא נמצא");
            return;
        }

        if (rating >= 4) {
            window.location.assign(business.googleUrl);
            return;
        }

        document.getElementById("rating-area").style.display = "none";
        document.getElementById("feedback-area").style.display = "block";
    }


    function submitFeedback() {

        document.getElementById("feedback-area").style.display = "none";

        document.getElementById("thanks").style.display = "block";
    }
</script>

</body>
</html>
